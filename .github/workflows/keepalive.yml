name: Keep-Alive — Supabase + Cloud Run

on:
  schedule:
    - cron: '0 12 * * *'   # todo dia às 12h UTC (09h Brasília)
  workflow_dispatch:         # permite rodar manualmente pelo GitHub

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping /health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 \
            https://finance-app-1042158013294.southamerica-east1.run.app/health)
          echo "HTTP status: $STATUS"
          # 200 = ok, 503 = degraded mas Cloud Run está vivo (DB acordando)
          # Qualquer outra coisa (0, 404, 502, 429) = falha real
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "503" ]; then
            echo "Falha inesperada: status $STATUS"
            exit 1
          fi
