name: Deploy

# Dispara automaticamente a cada push na branch main
on:
  push:
    branches: [main]

  # Permite rodar manualmente pelo painel do GitHub Actions
  workflow_dispatch:

# Garante que só um deploy roda por vez — o mais recente cancela o anterior
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy para Cloud Run
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Autenticar no Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Build separado do deploy — evita conflito de versão no Cloud Run.
      # gcloud run deploy --source leva ~3min (janela grande para conflito);
      # separando: build envia a imagem sem tocar no serviço, deploy é instantâneo.
      - name: Build imagem
        run: |
          gcloud builds submit \
            --machine-type=e2-highcpu-8 \
            --tag="southamerica-east1-docker.pkg.dev/financaspro-2024/cloud-run-source-deploy/finance-app:latest" \
            --quiet \
            .

      - name: Deploy para Cloud Run
        run: |
          gcloud run deploy finance-app \
            --image="southamerica-east1-docker.pkg.dev/financaspro-2024/cloud-run-source-deploy/finance-app:latest" \
            --region=southamerica-east1 \
            --quiet
