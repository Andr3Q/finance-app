name: Deploy

# Dispara automaticamente a cada push na branch main
on:
  push:
    branches: [main]

  # Permite rodar manualmente pelo painel do GitHub Actions
  workflow_dispatch:

# Garante que só um deploy roda por vez — o mais recente cancela o anterior
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy para Cloud Run
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Autenticar no Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy para Cloud Run
        run: |
          gcloud run deploy finance-app \
            --source . \
            --region southamerica-east1 \
            --quiet
