# ══════════════════════════════════════════════════════════════════
# CD — Deploy para Cloud Run
#
# Dispara em:
#   • Push na branch main (= merge de PR aprovada)
#   • workflow_dispatch (deploy manual, inclusive com flag de rollback)
#
# Fluxo obrigatório antes do deploy:
#   test-backend → test-frontend → build-check → test-e2e
#                                                      ↓
#                                              [ deploy ] → health check → ✅
#                                                                       ↓ falhou
#                                                                  [ rollback ]
#
# Segredos necessários (configurar em Settings > Secrets > Actions):
#   GCP_SA_KEY  — JSON da Service Account com roles:
#                 roles/run.developer, roles/storage.objectAdmin,
#                 roles/iam.serviceAccountUser, roles/cloudbuild.builds.builder
# ══════════════════════════════════════════════════════════════════
name: CD — Deploy para Cloud Run

on:
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      modo:
        description: 'Modo de execução'
        required: true
        type: choice
        default: deploy
        options:
          - deploy          # Deploy completo com testes
          - rollback        # Reverte para a revisão anterior sem testes
          - deploy-skip-e2e # Deploy direto (emergência) — pula E2E

# Só um deploy por vez — o mais recente cancela o anterior
concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

# ─────────────────────────────────────────────────────────────────
# JOBS DE TESTE (re-executados antes de todo deploy)
# Cópia intencional do ci.yml — o CD nunca confia em um CI externo.
# "Deploy nunca sobe código não-testado neste momento."
# ─────────────────────────────────────────────────────────────────

jobs:
  # ── 1. Testes Backend ────────────────────────────────────────
  test-backend:
    name: 🧪 Backend · Jest
    runs-on: ubuntu-latest
    if: github.event.inputs.modo != 'rollback'
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
        env:
          NODE_ENV: test

  # ── 2. Testes Frontend ───────────────────────────────────────
  test-frontend:
    name: 🧪 Frontend · Vitest
    runs-on: ubuntu-latest
    if: github.event.inputs.modo != 'rollback'
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:run

  # ── 3. Build de Produção ─────────────────────────────────────
  build-check:
    name: 🏗️ Build de Produção
    runs-on: ubuntu-latest
    if: github.event.inputs.modo != 'rollback'
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  # ── 4. Testes E2E ────────────────────────────────────────────
  test-e2e:
    name: 🎭 E2E · Playwright
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, build-check]
    # Pula apenas em rollback ou deploy-skip-e2e (emergência)
    if: |
      github.event.inputs.modo != 'rollback' &&
      github.event.inputs.modo != 'deploy-skip-e2e'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm ci
        working-directory: frontend
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-chromium-${{ runner.os }}-
      - name: Instalar Chromium (sem cache)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Instalar system deps (com cache)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:e2e
        env:
          CI: true
      - name: Upload relatório (em falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # 5. VALIDAÇÃO DE SCHEMA — bloqueia db push sem migration file
  #
  # Detecta a causa raiz dos incidentes 00220-00222:
  #   schema.prisma alterado sem criar migration → produção fica
  #   dessincronizada do código → 500 nas queries com campos novos.
  #
  # Requer: secret DATABASE_URL apontando para Supabase prod.
  # ─────────────────────────────────────────────────────────────
  validate-schema:
    name: 🗄️ Schema · Validar sincronismo com Supabase
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, test-e2e]
    if: |
      github.event.inputs.modo != 'rollback' &&
      (needs.test-backend.result == 'success' || needs.test-backend.result == 'skipped') &&
      (needs.test-frontend.result == 'success' || needs.test-frontend.result == 'skipped') &&
      (needs.test-e2e.result == 'success' || needs.test-e2e.result == 'skipped')

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Verificar integridade do schema
        run: npx prisma validate
        env:
          DATABASE_URL: "postgresql://localhost/fake"

      - name: Detectar schema sem migration correspondente
        # Se schema.prisma mudou neste commit mas sem novo arquivo de migration
        # → alerta que db push foi usado (produção pode estar dessincronizada)
        run: |
          SCHEMA_CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | grep "prisma/schema.prisma" || true)
          if [[ -n "$SCHEMA_CHANGED" ]]; then
            NEW_MIGRATION=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | grep "prisma/migrations/" || true)
            if [[ -z "$NEW_MIGRATION" ]]; then
              echo "⚠️  AVISO: schema.prisma foi alterado sem migration correspondente."
              echo "   Isso indica uso de 'prisma db push' — comum em desenvolvimento."
              echo "   Prosseguindo com 'prisma migrate deploy' que sincronizará o banco."
              echo "SCHEMA_DRIFT=true" >> "$GITHUB_ENV"
            else
              echo "✅ schema.prisma alterado e migration encontrada: $NEW_MIGRATION"
            fi
          else
            echo "✅ schema.prisma não foi alterado neste commit."
          fi

      - name: Status das migrations em produção
        run: npx prisma migrate status
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
        continue-on-error: true  # informativo — não bloqueia (migrate deploy resolve)

  # ─────────────────────────────────────────────────────────────
  # 6. MIGRATION — aplica migrations no Supabase ANTES do build
  #
  # Garante que a produção sempre recebe o schema correto ANTES
  # da nova imagem Docker ser buildada e servir tráfego.
  # Se falhar → deploy é bloqueado automaticamente.
  # ─────────────────────────────────────────────────────────────
  migrate-prod:
    name: 🗄️ Migration · Aplicar no Supabase
    runs-on: ubuntu-latest
    needs: [validate-schema]
    if: github.event.inputs.modo != 'rollback'
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Aplicar migrations pendentes no Supabase
        run: |
          echo "🗄️  Aplicando migrations no Supabase de produção..."
          for i in 1 2 3; do
            echo "Tentativa $i/3..."
            if npx prisma migrate deploy 2>&1; then
              echo "✅ Banco de dados sincronizado."
              exit 0
            fi
            [ $i -lt 3 ] && echo "⚠️ Falhou. Aguardando 15s..." && sleep 15
          done
          echo "❌ Migrations falharam após 3 tentativas — abortando deploy."
          exit 1
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}

      - name: Confirmar schema em produção
        run: |
          echo "🔍 Verificando tabelas críticas..."
          node -e "
            const { PrismaClient } = require('@prisma/client')
            const p = new PrismaClient()
            Promise.all([
              p.user.count(),
              p.budget.findFirst({ select: { id: true, endDate: true, endDateNotifSent: true } }),
            ]).then(([users]) => {
              console.log('✅ Banco acessível — total de usuários:', users)
              p.\$disconnect()
            }).catch(e => { console.error('❌ Erro ao acessar banco:', e.message); process.exit(1) })
          "
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
        continue-on-error: true  # conexão direta bloqueada pelo GitHub Actions; deploy segue

  # ─────────────────────────────────────────────────────────────
  # 7. DEPLOY — só roda se migrations passarem
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy · Cloud Run
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, build-check, test-e2e, migrate-prod]
    environment: production

    # Roda se:
    #   a) todos os jobs passaram (push normal ou deploy manual), OU
    #   b) modo rollback (sem testes, revertendo para revisão anterior)
    if: |
      always() && (
        (
          needs.test-backend.result == 'success' &&
          needs.test-frontend.result == 'success' &&
          needs.build-check.result == 'success' &&
          needs.migrate-prod.result == 'success' &&
          (needs.test-e2e.result == 'success' || needs.test-e2e.result == 'skipped')
        ) ||
        github.event.inputs.modo == 'rollback'
      )

    env:
      PROJECT:      financaspro-2024
      SERVICE:      finance-app
      REGION:       southamerica-east1
      HEALTH_URL:   https://finance-app-1042158013294.southamerica-east1.run.app/health

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Autenticar no Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # ── ROLLBACK (modo manual) ──────────────────────────────
      - name: Rollback para revisão anterior
        if: github.event.inputs.modo == 'rollback'
        run: |
          echo "🔄 Iniciando rollback..."
          PREV=$(gcloud run revisions list \
            --service "$SERVICE" --region "$REGION" \
            --format="value(name)" \
            --sort-by="~createTime" \
            --limit=2 | tail -1)

          if [[ -z "$PREV" ]]; then
            echo "❌ Nenhuma revisão anterior encontrada."
            exit 1
          fi

          echo "⏪ Revertendo para: $PREV"
          gcloud run services update-traffic "$SERVICE" \
            --region "$REGION" \
            --to-revisions="${PREV}=100" \
            --quiet

          echo "✅ Rollback concluído → $PREV (100% do tráfego)"

      # ── DEPLOY NORMAL ──────────────────────────────────────
      - name: Capturar revisão atual (para rollback em falha)
        if: github.event.inputs.modo != 'rollback'
        id: current-revision
        run: |
          CURRENT=$(gcloud run services describe "$SERVICE" \
            --region "$REGION" \
            --format="value(status.latestReadyRevisionName)" 2>/dev/null || echo "")
          echo "name=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "📌 Revisão atual: ${CURRENT:-nenhuma}"

      - name: Deploy para Cloud Run
        if: github.event.inputs.modo != 'rollback'
        run: |
          echo "🚀 Iniciando deploy..."
          gcloud run deploy "$SERVICE" \
            --source . \
            --region "$REGION" \
            --set-env-vars "EMAIL_FROM=${{ secrets.EMAIL_FROM }}" \
            --set-secrets "RESEND_API_KEY=RESEND_API_KEY:latest" \
            --quiet
          echo "✅ Deploy enviado — aguardando health check..."

      - name: Health check (3 tentativas · 20s de intervalo)
        if: github.event.inputs.modo != 'rollback'
        id: health-check
        run: |
          MAX=3; WAIT=20; OK=false
          for i in $(seq 1 $MAX); do
            echo "🏥 Health check $i/$MAX → $HEALTH_URL"
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 15 "$HEALTH_URL" || echo "000")
            echo "   HTTP $STATUS"
            if [[ "$STATUS" == "200" ]]; then
              echo "✅ Serviço saudável!"
              OK=true
              break
            fi
            [[ $i -lt $MAX ]] && echo "   Aguardando ${WAIT}s..." && sleep $WAIT
          done
          $OK || { echo "FAILED=true" >> "$GITHUB_OUTPUT"; exit 1; }

      - name: Smoke tests — endpoints críticos
        if: github.event.inputs.modo != 'rollback' && steps.health-check.outcome == 'success'
        run: |
          BASE="https://finance-app-1042158013294.southamerica-east1.run.app"
          FAIL=false

          check() {
            local name=$1 url=$2 expected=$3
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$url")
            [ -z "$STATUS" ] && STATUS="000"
            if [[ "$STATUS" == "$expected" ]]; then
              echo "  ✅ $name → HTTP $STATUS"
            else
              echo "  ❌ $name → esperado $expected, recebeu $STATUS"
              FAIL=true
            fi
          }

          echo "🔥 Smoke tests pós-deploy:"
          check "/health (200)"                    "$BASE/health"                   "200"
          check "/api/auth/me sem token (401)"     "$BASE/api/auth/me"              "401"
          check "/api/budget sem token (401)"      "$BASE/api/budget"               "401"
          check "/api/monitor protegido (401)"      "$BASE/api/monitor/dashboard"    "401"
          check "SPA /dashboard servido (200)"     "$BASE/dashboard"                "200"
          check "SPA /settings servido (200)"      "$BASE/settings"                 "200"

          $FAIL && { echo "❌ Smoke tests falharam — iniciando rollback"; exit 1; } || echo "✅ Todos os smoke tests passaram"

      - name: Rollback automático (deploy ou smoke tests falharam)
        if: |
          failure() &&
          steps.current-revision.outputs.name != ''
        run: |
          PREV="${{ steps.current-revision.outputs.name }}"
          echo "🔄 Falha detectada — revertendo para $PREV"
          gcloud run services update-traffic "$SERVICE" \
            --region "$REGION" \
            --to-revisions="${PREV}=100" \
            --quiet
          echo "✅ Rollback automático concluído → $PREV"
          exit 1   # garante que o job seja marcado como falho

      - name: Resumo do deploy
        if: success() && github.event.inputs.modo != 'rollback'
        run: |
          NEW=$(gcloud run services describe "$SERVICE" \
            --region "$REGION" \
            --format="value(status.latestReadyRevisionName)")
          echo "## ✅ Deploy concluído" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Serviço** | \`$SERVICE\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Revisão** | \`$NEW\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Região** | \`$REGION\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **URL** | $HEALTH_URL |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Proteções ativas" >> "$GITHUB_STEP_SUMMARY"
          echo "- ✅ Migrations aplicadas no Supabase antes do build" >> "$GITHUB_STEP_SUMMARY"
          echo "- ✅ Build e deploy via Cloud Build" >> "$GITHUB_STEP_SUMMARY"
          echo "- ✅ Smoke tests: health, auth, budget, monitor 401, SPA routes" >> "$GITHUB_STEP_SUMMARY"
