<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Nancy — Controle suas finanças com inteligência artificial. Gerencie gastos, metas e contas fixas em um só lugar." />

    <!-- Open Graph — preview ao compartilhar no WhatsApp, LinkedIn, etc. -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://finance-app-1042158013294.southamerica-east1.run.app/" />
    <meta property="og:title"       content="Nancy — Seu Gestor Financeiro Inteligente" />
    <meta property="og:description" content="Controle gastos, defina metas e receba relatórios com IA. Experimente grátis por 7 dias." />
    <meta property="og:image"       content="https://finance-app-1042158013294.southamerica-east1.run.app/screenshot-desktop.png" />
    <meta property="og:image:width"  content="1280" />
    <meta property="og:image:height" content="800" />
    <meta property="og:locale"      content="pt_BR" />
    <meta property="og:site_name"   content="Nancy" />

    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Nancy — Seu Gestor Financeiro Inteligente" />
    <meta name="twitter:description" content="Controle gastos, defina metas e receba relatórios com IA. Experimente grátis por 7 dias." />
    <meta name="twitter:image"       content="https://finance-app-1042158013294.southamerica-east1.run.app/screenshot-desktop.png" />

    <!-- PWA: manifest e tema -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1C48FF" />

    <!-- PWA: instalável no iOS (Safari) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nancy" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- PWA: instalável no Android (Chrome) -->
    <meta name="mobile-web-app-capable" content="yes" />

    <title>Nancy — Seu Gestor Financeiro Inteligente</title>

    <!-- Fonte: Sora, hospedada no app (@font-face em src/index.css). Pré-carrega o subconjunto latino, que cobre o português. -->
    <link rel="preload" href="/src/assets/fonts/sora-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Ícone do app (aparece na aba do navegador) -->
    <link rel="icon" href="/logo-icon.png" type="image/png" sizes="200x200" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />

    <script src="/theme-init.js"></script>
    <script src="/pwa-init.js"></script>
    <!-- Runtime config injetado pelo backend (PostHog key, etc.) -->
    <!-- Executado sincronamente antes do module script para garantir disponibilidade -->
    <script src="/app-config.js"></script>

    <!-- Splash de abertura — vídeo sem áudio, 4,1s: /splash-vertical.mp4
         (1080x1920) com a tela em pé, /splash.mp4 (1600x900) deitada; a escolha
         é feita por /splash-init.js. Puro HTML/CSS, sem depender do bundle
         React (que ainda não carregou nesse ponto). Removido por main.jsx
         depois que o app monta, ao fim do vídeo (SPLASH_MIN_MS). O vídeo já
         termina em preto, então a transição de opacidade revela o app sem
         corte visível. -->
    <style>
      #app-splash {
        position: fixed; inset: 0; z-index: 99999; background: #000;
        transition: opacity .4s ease, visibility .4s ease;
      }
      #app-splash.splash-hide { opacity: 0; visibility: hidden; pointer-events: none; }
      /* O que a abertura não cobre mostra o fundo da página: no iPhone sobra uma faixa embaixo (≈47px) e, no tema claro, ela aparecia
         azul/cinza. Enquanto a abertura está na tela o fundo é preto, como o vídeo (a marca sai em main.jsx). */
      html.is-splashing, html.is-splashing[data-theme] { background: #000 !important; }
      #app-splash video {
        position: absolute; inset: 0; width: 100%; height: 100%;
        object-fit: cover; display: block;
      }
    </style>
  </head>
  <body>
    <div id="app-splash" aria-hidden="true">
      <video id="app-splash-video" autoplay muted playsinline preload="auto" disablepictureinpicture disableremoteplayback></video>
    </div>
    <script src="/splash-init.js"></script>

    <!-- O React injeta todo o app dentro desta div -->
    <div id="root"></div>
    <!-- Entry point do React (Vite usa isso para compilar o bundle) -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
