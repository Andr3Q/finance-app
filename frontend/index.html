<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Nancy — Controle suas finanças com inteligência artificial. Gerencie gastos, metas e contas fixas em um só lugar." />

    <!-- Open Graph — preview ao compartilhar no WhatsApp, LinkedIn, etc. -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://finance-app-1042158013294.southamerica-east1.run.app/" />
    <meta property="og:title"       content="Nancy — Seu Gestor Financeiro Inteligente" />
    <meta property="og:description" content="Controle gastos, defina metas e receba relatórios com IA. Experimente grátis por 7 dias." />
    <meta property="og:image"       content="https://finance-app-1042158013294.southamerica-east1.run.app/screenshot-desktop.png" />
    <meta property="og:image:width"  content="1280" />
    <meta property="og:image:height" content="800" />
    <meta property="og:locale"      content="pt_BR" />
    <meta property="og:site_name"   content="Nancy" />

    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Nancy — Seu Gestor Financeiro Inteligente" />
    <meta name="twitter:description" content="Controle gastos, defina metas e receba relatórios com IA. Experimente grátis por 7 dias." />
    <meta name="twitter:image"       content="https://finance-app-1042158013294.southamerica-east1.run.app/screenshot-desktop.png" />

    <!-- PWA: manifest e tema -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#111111" />

    <!-- PWA: instalável no iOS (Safari) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nancy" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- PWA: instalável no Android (Chrome) -->
    <meta name="mobile-web-app-capable" content="yes" />

    <title>Nancy — Seu Gestor Financeiro Inteligente</title>

    <!-- Fonte: Sora -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" /></noscript>

    <!-- Ícone do app (aparece na aba do navegador) -->
    <link rel="icon" href="/logo-icon.png" type="image/png" sizes="200x200" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />

    <script src="/theme-init.js"></script>
    <script src="/pwa-init.js"></script>
    <!-- Runtime config injetado pelo backend (PostHog key, etc.) -->
    <!-- Executado sincronamente antes do module script para garantir disponibilidade -->
    <script src="/app-config.js"></script>

    <!-- Splash de abertura — puro HTML/CSS, sem depender do bundle React (que
         ainda não carregou nesse ponto). Removido por main.jsx depois que o
         app monta. Estilo inline pra aparecer instantaneamente, sem esperar
         o CSS do Vite carregar.
         Sequência: barras sobem em cascata → nome "Nancy" surge por baixo →
         glow verde atrás das barras respira em loop até o app montar. -->
    <style>
      #app-splash {
        position: fixed; inset: 0; background: #000; z-index: 99999;
        display: flex; align-items: center; justify-content: center;
        transition: opacity .4s ease, visibility .4s ease;
      }
      #app-splash.splash-hide { opacity: 0; visibility: hidden; pointer-events: none; }
      .splash-mark {
        display: flex; flex-direction: column; align-items: center;
      }
      .splash-icon { position: relative; width: 100px; height: 64px; display: flex; align-items: center; justify-content: center; }
      .splash-glow {
        position: absolute; width: 100px; height: 100px; border-radius: 50%;
        background: #4ae2ac; filter: blur(30px);
        opacity: 0; animation: splashGlow 3s ease-in-out .65s infinite;
      }
      .splash-bars { position: relative; display: flex; align-items: flex-end; gap: 8px; height: 54px; }
      .splash-bars span {
        width: 13px; border-radius: 4px; background: #4ae2ac;
        opacity: 0; transform: scaleY(0); transform-origin: bottom;
        animation: splashBarIn .8s cubic-bezier(.34,1.56,.64,1) forwards,
                   splashBarFade .3s linear forwards;
        animation-delay: calc(var(--i) * 220ms + 200ms);
      }
      .splash-bars span:nth-child(1) { height: 22px; }
      .splash-bars span:nth-child(2) { height: 38px; }
      .splash-bars span:nth-child(3) { height: 54px; }
      .splash-word {
        margin-top: 22px; font-family: 'Sora', sans-serif; font-weight: 800;
        font-size: 42px; color: #4ae2ac; letter-spacing: -.5px;
        opacity: 0; transform: translateY(16px);
        animation: splashWordIn 1s cubic-bezier(.2,.8,.2,1) .9s forwards;
      }
      @keyframes splashBarIn { to { transform: scaleY(1); } }
      @keyframes splashBarFade { to { opacity: 1; } }
      @keyframes splashWordIn { to { opacity: 1; transform: translateY(0); } }
      @keyframes splashGlow {
        0%, 100% { opacity: .16; transform: scale(1); }
        50%      { opacity: .23; transform: scale(1.05); }
      }
    </style>
  </head>
  <body>
    <div id="app-splash" aria-hidden="true">
      <div class="splash-mark">
        <div class="splash-icon">
          <div class="splash-glow"></div>
          <div class="splash-bars">
            <span style="--i:0"></span><span style="--i:1"></span><span style="--i:2"></span>
          </div>
        </div>
        <div class="splash-word">Nancy</div>
      </div>
    </div>

    <!-- O React injeta todo o app dentro desta div -->
    <div id="root"></div>
    <!-- Entry point do React (Vite usa isso para compilar o bundle) -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
