<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="FinançasPro — Controle suas finanças em tempo real" />

    <!-- PWA: manifest e tema -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#020d10" />

    <!-- PWA: instalável no iOS (Safari) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FinançasPro" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- PWA: instalável no Android (Chrome) -->
    <meta name="mobile-web-app-capable" content="yes" />

    <title>FinançasPro 💸</title>

    <!-- Fontes: Syne (display/headings) + DM Sans (body) — Liquid Aurora v4 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Space+Grotesk:wght@400;500;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" /></noscript>

    <!-- Ícone do app (aparece na aba do navegador) -->
    <link rel="icon" href="/icon-192.png" type="image/png" />

    <script>
      // Captura beforeinstallprompt o mais cedo possível — antes do React montar.
      // O evento pode disparar durante o carregamento inicial da página, antes
      // do useEffect do App.jsx ter chance de registrar o listener.
      window.__installPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__installPrompt = e;
      });

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js', { scope: '/', updateViaCache: 'none' })
            .then(function(reg) { reg.update(); });
          navigator.serviceWorker.addEventListener('controllerchange', function() {
            window.location.reload();
          });
        });
      }
    </script>
  </head>
  <body>
    <!-- O React injeta todo o app dentro desta div -->
    <div id="root"></div>
    <!-- Entry point do React (Vite usa isso para compilar o bundle) -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
