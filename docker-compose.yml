# ═══════════════════════════════════════════════════════
# 🐳 docker-compose.yml — FinançasPro
#
# Define os 3 "contêineres" que rodam juntos:
#   db       → Banco de dados PostgreSQL (guarda seus dados)
#   backend  → API Node.js (regras de negócio, e-mail, PDF)
#   frontend → Interface React (o que você vê no navegador)
#
# Comandos úteis:
#   docker compose up --build   → Inicia tudo (primeira vez)
#   docker compose up           → Inicia sem rebuildar
#   docker compose down         → Para tudo
#   docker compose logs -f      → Ver logs em tempo real
# ═══════════════════════════════════════════════════════

services:

  # ───────────────────────────────────────────────
  # 🗄️  db — PostgreSQL local (desativado)
  #
  # O banco agora é o Neon (nuvem), configurado em .env.
  # Tanto o docker-compose local quanto o Cloud Run usam
  # o mesmo banco → dados sempre sincronizados.
  #
  # Para reativar banco local: descomente o bloco abaixo
  # e adicione "depends_on: db" no serviço backend.
  # ───────────────────────────────────────────────
  # db:
  #   image: postgres:15-alpine
  #   container_name: financas_db
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: financeuser
  #     POSTGRES_PASSWORD: financepass
  #     POSTGRES_DB: financedb
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"

  # ───────────────────────────────────────────────
  # ⚙️  backend — API Node.js + Express
  #
  # Responsável por: processar requisições do frontend,
  # calcular saldos, validar logins, gerar PDFs e
  # enviar e-mails. É o "cérebro" do sistema.
  # ───────────────────────────────────────────────
  backend:
    build: ./backend                   # Usa o Dockerfile em ./backend/
    container_name: financas_backend
    restart: on-failure
    env_file:
      - .env                           # DATABASE_URL, JWT_SECRET, EMAIL_* vêm do .env
    ports:
      - "3001:3001"                    # API acessível em http://localhost:3001
    volumes:
      - ./backend:/app                 # Monta o código local → hot reload funciona
      - /app/node_modules              # Preserva node_modules do container
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', r => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # ───────────────────────────────────────────────
  # 🎨  frontend — React + Vite
  #
  # Responsável por: exibir a interface visual,
  # atualizar o saldo em tempo real e comunicar
  # com o backend via chamadas HTTP (fetch/axios).
  # ───────────────────────────────────────────────
  frontend:
    build: ./frontend                  # Usa o Dockerfile em ./frontend/
    container_name: financas_frontend
    restart: on-failure
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:5173"                    # App acessível em http://localhost:5173
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true       # Hot-reload funciona no Docker (Linux)
      - VITE_HOST=0.0.0.0
      - BACKEND_HOST=backend           # Resolve o hostname interno do Docker
    stdin_open: true                   # Mantém o container ativo (evita parada inesperada)
    tty: true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

# ───────────────────────────────────────────────────────
# 💾 Volumes — Armazenamento persistente do Docker
# Os dados do banco ficam aqui mesmo após "docker compose down"
# ───────────────────────────────────────────────────────
volumes:
  postgres_data:
