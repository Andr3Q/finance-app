# ═══════════════════════════════════════════════════════
# 🐳 docker-compose.yml — FinançasPro (Desenvolvimento)
#
# Define os 3 "contêineres" que rodam juntos:
#   db       → Banco de dados PostgreSQL LOCAL (isolado da produção)
#   backend  → API Node.js (regras de negócio, e-mail, PDF)
#   frontend → Interface React (o que você vê no navegador)
#
# Comandos úteis:
#   docker compose up --build   → Inicia tudo (primeira vez)
#   docker compose up           → Inicia sem rebuildar
#   docker compose down         → Para tudo
#   docker compose down -v      → Para tudo E apaga o banco local
#   docker compose logs -f      → Ver logs em tempo real
#   docker compose run --rm seed → Popula banco com dados de teste
#
# ⚠️  Este ambiente usa PostgreSQL LOCAL — completamente isolado
#     do banco de produção (Supabase). Teste à vontade.
# ═══════════════════════════════════════════════════════

services:

  # ───────────────────────────────────────────────
  # 🗄️  db — PostgreSQL 15 local (desenvolvimento)
  #
  # Banco isolado da produção. Dados ficam em volume
  # local e são apagados apenas com "docker compose down -v".
  # ───────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: financas_db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     dev_user
      POSTGRES_PASSWORD: dev_pass_local
      POSTGRES_DB:       financas_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_user -d financas_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ───────────────────────────────────────────────
  # ⚙️  backend — API Node.js + Express
  # ───────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: financas_backend
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env                            # JWT_SECRET, EMAIL_*, VAPID_*, MP_*, GROQ_*
    environment:
      - NODE_ENV=production             # rate limits de prod ativos (loginLimiter max=10)
      - DATABASE_URL=postgresql://dev_user:dev_pass_local@db:5432/financas_dev
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app                  # bind mount → hot reload funciona
      - /app/node_modules
    command: >
      sh -c "npx prisma db push --accept-data-loss && node src/server.js"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', r => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # ───────────────────────────────────────────────
  # 🌱  seed — Popula banco com dados de teste
  # Executar: docker compose run --rm seed
  # ───────────────────────────────────────────────
  seed:
    build: ./backend
    container_name: financas_seed
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://dev_user:dev_pass_local@db:5432/financas_dev
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: node prisma/seed.staging.js
    profiles:
      - seed

  # ───────────────────────────────────────────────
  # 🎨  frontend — React + Vite
  # ───────────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: financas_frontend
    restart: on-failure
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_HOST=0.0.0.0
      - BACKEND_HOST=backend
    stdin_open: true
    tty: true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

# ───────────────────────────────────────────────────────
# 💾 Volumes
# ───────────────────────────────────────────────────────
volumes:
  postgres_data:
    name: financas_dev_db

# ───────────────────────────────────────────────────────
# 🌐 Rede — IPv4 apenas (banco é local, não precisa de IPv6)
# ───────────────────────────────────────────────────────
networks:
  default:
    enable_ipv6: false
